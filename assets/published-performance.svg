<text x="72" y="630" font-size="19" fill="#172f42" font-weight="700" text-anchor="start">Interpretation</text>
<text x="72" y="662" font-size="19" fill="#172f42" font-weight="400" text-anchor="start">Group II has the highest mean. Omnibus ANOVA does not establish II &gt; I in a pairwise test.</text>
<text x="48" y="740" font-size="16" fill="#526b7a" font-weight="400" text-anchor="start">Source: Shiu &amp; Yasumoto (2018), Fig. 3 and footnote 6, pp. 387-388. Projects: 2012-2014.</text>
<text x="48" y="768" font-size="16" fill="#526b7a" font-weight="400" text-anchor="start">Redrawn from published aggregates. No individual project observations or confidence intervals are shown.</text>
