<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc">
<title id="title">Platform knowledge and industry strategy</title>
<desc id="desc">A triadic knowledge relationship links platform providers, brands and contract manufacturers. Governance supports specialization.</desc>
<rect width="1200" height="770" rx="18" fill="#f5f8fa"/>
<g font-family="system-ui, -apple-system, 'Noto Sans', sans-serif">
<text x="48" y="45" font-size="16" fill="#337d80" font-weight="700" text-anchor="start">INDUSTRY COMPETITION &amp; STRATEGY</text>
<text x="48" y="91" font-size="34" fill="#172f42" font-weight="700" text-anchor="start">Who controls knowledge, decisions and value?</text>
<text x="48" y="125" font-size="18" fill="#526b7a" font-weight="400" text-anchor="start">Historical mobile phone case | Research projects: 2012-2014</text>
<rect x="345" y="160" width="510" height="135" rx="14" fill="#193e53"/>
<text x="600" y="201" font-size="24" fill="white" font-weight="700" text-anchor="middle">PLATFORM PROVIDERS</text>
<text x="600" y="236" font-size="20" fill="#d7eaed" font-weight="400" text-anchor="middle">Core components + architecture knowledge</text>
<text x="600" y="267" font-size="17" fill="#d7eaed" font-weight="400" text-anchor="middle">Road maps | Reference designs | Technical support</text>
<path d="M440 295 L300 352 M760 295 L900 352" stroke="#739ca9" stroke-width="3" fill="none"/>
<path d="M303 338 L300 352 L315 350 M885 350 L900 352 L897 338" stroke="#739ca9" stroke-width="3" fill="none"/>
<rect x="48" y="365" width="500" height="166" rx="14" fill="white" stroke="#ccdbe2"/>
<rect x="652" y="365" width="500" height="166" rx="14" fill="white" stroke="#ccdbe2"/>
<text x="76" y="408" font-size="24" fill="#172f42" font-weight="700" text-anchor="start">BRAND FIRMS</text>
<text x="76" y="445" font-size="18" fill="#172f42" font-weight="400" text-anchor="start">Customer needs + core component knowledge</text>
<text x="76" y="478" font-size="18" fill="#172f42" font-weight="400" text-anchor="start">Define concepts, functions and key trade-offs</text>
<text x="76" y="510" font-size="17" fill="#337d80" font-weight="600" text-anchor="start">Strategic focus: differentiated product definition</text>
<text x="680" y="408" font-size="24" fill="#172f42" font-weight="700" text-anchor="start">CONTRACT MANUFACTURERS</text>
<text x="680" y="445" font-size="18" fill="#172f42" font-weight="400" text-anchor="start">Architecture + integration + implementation</text>
<text x="680" y="478" font-size="18" fill="#172f42" font-weight="400" text-anchor="start">Connect components, test and solve problems</text>
<text x="680" y="510" font-size="17" fill="#337d80" font-weight="600" text-anchor="start">Strategic focus: value-added development services</text>
<path d="M556 446 H644" stroke="#337d80" stroke-width="3"/>
<path d="M568 438 L556 446 L568 454 M632 438 L644 446 L632 454" stroke="#337d80" stroke-width="3" fill="none"/>
<rect x="48" y="564" width="1104" height="112" rx="14" fill="#e2efed"/>
<text x="76" y="602" font-size="19" fill="#245d60" font-weight="700" text-anchor="start">GOVERNANCE SUPPORTS SPECIALIZATION</text>
<text x="76" y="635" font-size="20" fill="#172f42" font-weight="400" text-anchor="start">Early problem solving + clear decision rights + change control + ongoing communication</text>
<text x="48" y="714" font-size="16" fill="#526b7a" font-weight="400" text-anchor="start">Source: Shiu &amp; Yasumoto (2018), pp. 374-382, 390-391. Diagram: new case synthesis.</text>
<text x="48" y="741" font-size="16" fill="#526b7a" font-weight="400" text-anchor="start">Strategic outcomes and actions shown here are interpretations; no intervention effects were measured.</text>
</g>
</svg>
